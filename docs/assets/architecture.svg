<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1160" viewBox="0 0 1680 1160" role="img" aria-labelledby="title description">
<title id="title">Pharos architecture</title>
<desc id="description">A mathematician guides a project main agent, which assigns proof tasks to workers and requests advice from helpers. Worker submissions receive fresh verification; the gateway writes accepted facts and returns repair feedback on rejection. Shared memory and checkpoints support continued research, progress reports, and a paper workflow with section and whole-paper review.</desc>
